# ---------------------------------------------------------------------------
# Full-stack deployment: Flask API + nginx serving the dashboard.
#
#   docker compose up --build          dashboard on http://localhost:8080
#   docker compose exec api python src/main.py --log samples/demo.log
#   docker compose down -v             stop and discard the database
#
# The browser only ever talks to nginx: pages come from the same origin as
# /api/, so config.js uses its default BASE_URL "/api/v1" and there is no
# cross-origin request. For API-only work use backend/docker-compose.yml.
#
# Override the published port or secret with a root .env file (see
# .env.example).
# ---------------------------------------------------------------------------
services:
  api:
    build: ./backend
    image: insha-backend
    container_name: insha-api
    # Not published to the host: only nginx needs to reach it, over the
    # compose network. Publish it explicitly if you want direct API access.
    expose:
      - "5000"
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      DB_PATH: instance/logs.db
      REPORTS_DIR: reports
      ANALYSIS_THRESHOLD: "5"
      RISK_DECAY_LAMBDA: "${RISK_DECAY_LAMBDA:-}"
      HONEYPOT_IPS: "${HONEYPOT_IPS:-}"
      MAX_UPLOAD_MB: "16"
      FLASK_ENV: production
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
    volumes:
      - db-data:/app/instance
      - reports-data:/app/reports
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, urllib.request
          url = "http://127.0.0.1:5000/api/v1/health"
          sys.exit(0 if urllib.request.urlopen(url, timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    image: nginx:1.27-alpine
    container_name: insha-web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # Read-only: the dashboard is static, nginx never writes to it.
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  reports-data:
