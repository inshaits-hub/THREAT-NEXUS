# ---------------------------------------------------------------------------
# nginx front door for the dashboard.
#
# Serves the static frontend from /usr/share/nginx/html and reverse-proxies
# /api/ and /socket.io/ to the Flask container. Because everything is on one
# origin, config.js keeps its default BASE_URL of "/api/v1" and no CORS is
# involved.
#
#   docker compose up --build      dashboard on http://localhost:8080
#
# The API and Socket.IO location blocks must stay above the SPA/static
# catch-all.
# ---------------------------------------------------------------------------

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Uploads have to make it through nginx as well as Flask. Keep this at
    # least as large as the API's MAX_UPLOAD_MB (default 16), otherwise nginx
    # rejects the body with its own 413 before Flask ever sees it.
    client_max_body_size 16m;

    # gzip the text assets the dashboard ships. Tailwind's CDN output is
    # already compressed, so this is mostly for our own css/js.
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API reverse proxy -------------------------------------------------
    location /api/ {
        # No trailing path on proxy_pass: the full original URI (/api/v1/...)
        # is forwarded unchanged to Flask.
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Analysis can be slow on a large upload; outlast gunicorn's own
        # --timeout 120 rather than cutting the connection first.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # --- Live alerts (Socket.IO / WebSocket) ---------------------------------
    # The dashboard connects to /socket.io/ for real-time threat alerts.
    # WebSockets need HTTP/1.1 plus the Upgrade/Connection headers, and a long
    # read timeout so an idle but open dashboard tab is not dropped.
    location /socket.io/ {
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Static dashboard --------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # Do not serve the source docs or the deploy config as static content.
    location = /README.md {
        return 404;
    }
}