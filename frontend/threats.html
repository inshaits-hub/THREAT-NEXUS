<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base-url" content="https://insha-2ed64.containers.snapdeploy.app/api/v1">
  <title>Threats - THREAT-NEXUS</title>
  <script src="js/head.js"></script>
</head>

<body class="bg-surface text-on-surface font-body-md text-body-md antialiased m-0 p-0" data-page="threats">
  <div id="app-shell"></div>
  <script src="js/ui/layout.js"></script>
  <main class="app-content">

    <div class="page-head">
      <div class="min-w-0">
        <h1 class="page-title">Threats</h1>
        <p class="page-sub">
          <span id="threats-count">-</span>
        </p>
      </div>
      <button class="btn btn-secondary" id="threats-export-button" type="button">
        <span class="material-symbols-outlined" data-icon="file_download">file_download</span>
        <span>Export report</span>
      </button>
    </div>

    <div class="card mb-4">
      <div class="card-body !py-3">
        <div class="flex flex-wrap items-end gap-3">
          <div class="field flex-1 min-w-[220px]">
            <label class="field-label" for="threats-search">Search</label>
            <div class="search-field">
              <span class="material-symbols-outlined" data-icon="search">search</span>
              <input class="input" id="threats-search" placeholder="IP, type or details" type="text"
                autocomplete="off" />
            </div>
          </div>
          <div class="field w-full sm:w-auto sm:min-w-[168px]">
            <label class="field-label" for="threats-filter-severity">Severity</label>
            <select class="select" id="threats-filter-severity">
              <option value="">All severities</option>
              <option value="CRITICAL">Critical</option>
              <option value="HIGH">High</option>
              <option value="MEDIUM">Medium</option>
              <option value="LOW">Low</option>
            </select>
          </div>
          <div class="field w-full sm:w-auto sm:min-w-[212px]">
            <label class="field-label" for="threats-filter-type">Threat type</label>
            <select class="select" id="threats-filter-type">
              <option value="">All types</option>
              <option value="SSH_BRUTE_FORCE">SSH Brute-Force Attack</option>
              <option value="SSH_BRUTE_FORCE_SUCCESS">Successful Brute-Force Login</option>
              <option value="SQL_INJECTION">SQL Injection Attempt</option>
              <option value="XSS_ATTEMPT">Cross-Site Scripting Attempt</option>
              <option value="DIRECTORY_TRAVERSAL">Directory Traversal Attempt</option>
              <option value="TRAFFIC_SPIKE">Traffic Spike / Volumetric Pattern</option>
              <option value="OFF_HOUR_ADMIN">Off-Hour Administrative Activity</option>
              <option value="WEB_DIRECTORY_SCAN">Web Content Scan</option>
              <option value="PORT_SCAN">Port Scan</option>
            </select>
          </div>
          <div class="field w-full sm:w-auto sm:min-w-[150px]">
            <label class="field-label" for="threats-filter-time">Time window</label>
            <select class="select" id="threats-filter-time">
              <option value="24">Last 24 hours</option>
              <option value="12">Last 12 hours</option>
              <option value="6">Last 6 hours</option>
              <option value="1">Last 1 hour</option>
              <option value="168">Last 7 days</option>
            </select>
          </div>
          <button class="btn btn-ghost shrink-0" id="threats-clear-filters" type="button">
            <span class="material-symbols-outlined" data-icon="filter_alt_off">filter_alt_off</span>
            <span>Clear</span>
          </button>
        </div>
      </div>
    </div>

    <div class="card overflow-hidden">
      <div class="table-wrap custom-scroll">
        <table class="dtable min-w-[860px]">
          <thead>
            <tr>
              <th scope="col" class="w-[132px]">Severity</th>
              <th scope="col">Type</th>
              <th scope="col" class="w-[148px]">Source IP</th>
              <th scope="col" class="min-w-[240px]">Details</th>
              <th scope="col" class="num w-[110px]">Risk</th>
              <th scope="col" class="num w-[168px] cursor-pointer select-none" id="threats-sort-last-seen"
                scope="col">
                <span class="inline-flex items-center gap-1.5">
                  <span>Last seen</span>
                  <span class="material-symbols-outlined" data-icon="arrow_downward"
                    id="threats-sort-icon">arrow_downward</span>
                </span>
              </th>
            </tr>
          </thead>
          <tbody id="threats-tbody"></tbody>
        </table>
      </div>
      <footer
        class="px-5 py-3 bg-surface-container-lowest border-t border-surface-container flex flex-wrap justify-between items-center gap-3 text-[12.5px] text-secondary select-none">
        <div id="threats-range">-</div>
        <div class="flex items-center gap-4 sm:gap-5">
          <div class="flex items-center gap-2">
            <label class="hidden sm:inline" for="threats-page-size">Rows</label>
            <select class="select !w-auto !h-[30px] !py-0 !text-[12.5px]" id="threats-page-size">
              <option>25</option>
              <option>50</option>
              <option>100</option>
            </select>
          </div>
          <div class="flex items-center gap-1">
            <button class="btn btn-icon" aria-label="Previous page" id="threats-prev-button" type="button">
              <span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
            </button>
            <button class="btn btn-icon" aria-label="Next page" id="threats-next-button" type="button">
              <span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
            </button>
          </div>
        </div>
      </footer>
    </div>
  </main>

  <div
    class="fixed inset-0 bg-rail/55 backdrop-blur-[2px] z-[60] flex items-center justify-center p-4 overflow-y-auto hidden"
    aria-labelledby="export-dialog-title" aria-modal="true" id="export-dialog-overlay" role="dialog">
    <div
      class="w-full max-w-[460px] bg-white border border-outline-variant shadow-popover p-5 sm:p-6 z-50 rounded-xl relative my-auto animate-rise">
      <div class="flex items-center justify-between pb-3 border-b border-surface-container">
        <h2 class="text-[15px] font-semibold text-on-surface" id="export-dialog-title">Export report</h2>
        <button class="btn btn-icon !w-7 !h-7" aria-label="Close dialog" id="export-dialog-close-button"
          type="button">
          <span class="material-symbols-outlined" data-icon="close">close</span>
        </button>
      </div>
      <div class="pt-4 space-y-5">
        <div>
          <span class="field-label block mb-2">Export format</span>
          <div class="space-y-2">
            <label
              class="flex items-center gap-2.5 cursor-pointer border border-outline-variant rounded-lg px-3 py-2.5 hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary/[0.04]">
              <input class="w-4 h-4 accent-primary" checked id="export-format-html" name="format" type="radio"
                value="html" />
              <span class="text-body-md text-on-surface">
                HTML <span class="text-secondary text-body-sm">(readable summary)</span>
              </span>
            </label>
            <label
              class="flex items-center gap-2.5 cursor-pointer border border-outline-variant rounded-lg px-3 py-2.5 hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary/[0.04]">
              <input class="w-4 h-4 accent-primary" id="export-format-json" name="format" type="radio" value="json" />
              <span class="text-body-md text-on-surface">
                JSON <span class="text-secondary text-body-sm">(raw data)</span>
              </span>
            </label>
          </div>
        </div>
        <div class="pt-2 border-t border-surface-container">
          <p class="text-body-sm text-secondary" id="export-dialog-helper-text"></p>
        </div>
      </div>
      <p class="text-[12.5px] text-sev-critical-text mt-3 hidden" id="export-dialog-error"></p>
      <div class="border-t border-surface-container pt-4 mt-5 flex justify-end gap-2.5">
        <button class="btn btn-secondary" id="export-dialog-cancel-button" type="button">Cancel</button>
        <button class="btn btn-primary" id="export-dialog-export-button" type="button">
          <span class="material-symbols-outlined" data-icon="download">download</span>
          <span>Export</span>
        </button>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/core/dom.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/core/pagination.js"></script>
  <script src="js/ui/severity.js"></script>
  <script src="js/services/http-client.js"></script>
  <script src="js/services/mock-data.js"></script>
  <script src="js/services/report-builder.js"></script>
  <script src="js/services/download.js"></script>
  <script src="js/services/mock-api.js"></script>
  <script src="js/services/api.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/services/live.js"></script>
  <script src="js/pages/threats.js"></script>
</body>

</html>
