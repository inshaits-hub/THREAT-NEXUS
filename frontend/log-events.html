<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base-url" content="https://insha-2ed64.containers.snapdeploy.app/api/v1">
  <title>Log events - THREAT-NEXUS</title>
  <script src="js/head.js"></script>
</head>

<body class="bg-surface text-on-surface font-body-md text-body-md antialiased m-0 p-0" data-page="log-events">
  <div id="app-shell"></div>
  <script src="js/ui/layout.js"></script>
  <main class="app-content">

    <div class="page-head">
      <div class="min-w-0">
        <h1 class="page-title">Log events</h1>
        <p class="page-sub">
          <span id="log-events-count">-</span>
          <span class="hidden" id="log-events-showing-note"></span>
        </p>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body !py-3">
        <div class="flex flex-wrap items-end gap-3">
          <div class="field flex-1 min-w-[220px]">
            <label class="field-label" for="log-events-search">Search</label>
            <div class="search-field">
              <span class="material-symbols-outlined" data-icon="search">search</span>
              <input class="input" id="log-events-search" placeholder="Event text, IP, user or path" type="text"
                autocomplete="off" />
            </div>
          </div>
          <div class="field w-full sm:w-auto sm:min-w-[152px]">
            <label class="field-label" for="log-events-filter-source">Source</label>
            <select class="select" id="log-events-filter-source">
              <option value="">All sources</option>
              <option value="ssh">SSH</option>
              <option value="nginx">Nginx</option>
              <option value="firewall">Firewall</option>
            </select>
          </div>
          <div class="field w-full sm:w-auto sm:min-w-[176px]">
            <label class="field-label" for="log-events-filter-action">Action</label>
            <select class="select" id="log-events-filter-action">
              <option value="">All actions</option>
              <option value="http">HTTP Request</option>
              <option value="failed">Failed Login</option>
              <option value="blocked">Blocked Drop</option>
              <option value="success">Successful Login</option>
            </select>
          </div>
          <label
            class="flex items-center gap-2 cursor-pointer select-none h-9 text-[12.5px] text-secondary shrink-0">
            <input class="w-4 h-4 accent-primary" id="log-events-filter-threat" type="checkbox" />
            <span>Only events linked to a threat</span>
          </label>
        </div>
      </div>
    </div>

    <div class="card overflow-hidden">
      <div class="table-wrap custom-scroll">
        <table class="dtable min-w-[820px]">
          <thead>
            <tr>
              <th scope="col" class="w-[132px]">Time</th>
              <th scope="col" class="w-[104px]">Source</th>
              <th scope="col" class="w-[140px]">IP</th>
              <th scope="col" class="w-[140px]">Action</th>
              <th scope="col" class="min-w-[160px]">User or path</th>
              <th scope="col" class="w-[92px]">Status</th>
              <th scope="col" class="w-[96px]">Threat</th>
            </tr>
          </thead>
          <tbody id="log-events-tbody"></tbody>
        </table>
      </div>
      <footer
        class="px-5 py-3 bg-surface-container-lowest border-t border-surface-container flex flex-wrap justify-between items-center gap-3 text-[12.5px] text-secondary select-none">
        <div id="log-events-range">-</div>
        <div class="flex items-center gap-4 sm:gap-5">
          <div class="flex items-center gap-2">
            <label class="hidden sm:inline" for="log-events-page-size">Rows</label>
            <select class="select !w-auto !h-[30px] !py-0 !text-[12.5px]" id="log-events-page-size">
              <option>25</option>
              <option>50</option>
              <option>100</option>
            </select>
          </div>
          <div class="flex items-center gap-1">
            <button class="btn btn-icon" id="log-events-prev-button" title="Previous page" type="button"
              aria-label="Previous page">
              <span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
            </button>
            <button class="btn btn-icon" id="log-events-next-button" title="Next page" type="button"
              aria-label="Next page">
              <span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
            </button>
          </div>
        </div>
      </footer>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/core/dom.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/core/pagination.js"></script>
  <script src="js/services/http-client.js"></script>
  <script src="js/services/mock-data.js"></script>
  <script src="js/services/report-builder.js"></script>
  <script src="js/services/download.js"></script>
  <script src="js/services/mock-api.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/pages/log-events.js"></script>
</body>

</html>
