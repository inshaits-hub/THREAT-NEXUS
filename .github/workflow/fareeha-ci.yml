name: "Threat Nexus - CI Pipeline"

on:
  push:
    branches:
      - main
      - fariha_dev
      - fareeha-naveed-ci

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fareeha-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: "Fareeha Naveed | Backend Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile-check backend
        run: python -m compileall -q src tests

      - name: Run Alert Manager tests
        run: python -m pytest tests/test_threats.py -k "alert" -v

      - name: Run complete backend test suite
        run: python -m pytest -v --junitxml=test-results.xml

  docker-build:
    name: "Fareeha Naveed | Docker Build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build backend Docker image
        run: docker build --pull --tag threat-nexus-backend:ci -f backend/Dockerfile backend
